<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password | Christian Educators Global Network</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body>
<header class="site-nav"><a class="nav-wordmark" href="../index.html"><span class="nav-mark">CE</span><span>Christian Educators<small>Global Network</small></span></a></header>
<main class="content-section"><section class="form-panel" aria-labelledby="reset-heading"><p class="section-label">Account recovery</p><h1 id="reset-heading" style="font-size:clamp(2rem,4vw,3.25rem);">Reset your password</h1><form id="request-password-reset-form" novalidate><div class="form-grid"><div class="field field-full"><label for="reset-email">Email address</label><input id="reset-email" name="email" type="email" autocomplete="email" required></div></div><p class="form-error" hidden></p><p class="form-success" hidden></p><div class="action-row"><button class="action-button" type="submit">Email Reset Link</button><a class="action-button alt" href="member-login.html">Back to Login</a></div></form><form id="reset-password-form" hidden novalidate><div class="form-grid"><div class="field field-full"><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" required><small>Use at least 12 characters.</small></div></div><p class="form-error" hidden></p><p class="form-success" hidden></p><div class="action-row"><button class="action-button" type="submit">Set New Password</button></div></form></section></main>
<script src="../assets/js/main.js"></script>
</body>
</html>
